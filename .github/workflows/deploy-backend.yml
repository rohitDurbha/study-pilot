name: Deploy backend

# Pushes the Flask backend to a free Hugging Face Docker Space whenever the
# backend changes on main, waits until the Space answers on /health, then
# calls real API routes on it. The check calls no language model, so a deploy
# uses none of the Groq or Gemini free tier quota.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy to Hugging Face
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: backend
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
      # Leave FRONTEND_ORIGIN unset to keep whatever the frontend deploy wrote
      # into the Space. Set the repository variable to override it.
      FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
    outputs:
      url: ${{ steps.push.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt huggingface_hub
      - name: Run tests
        run: python -m pytest -q
      - name: Push to the Space
        id: push
        run: python deploy_space.py deploy
      - name: Wait for the Space to build and answer
        env:
          HF_SPACE_REPO_ID: ${{ steps.push.outputs.repo_id }}
        run: python deploy_space.py wait
      - name: Call the live API
        env:
          HF_SPACE_REPO_ID: ${{ steps.push.outputs.repo_id }}
        run: python deploy_space.py check
      - name: Summary
        run: echo "Backend live at ${{ steps.push.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
